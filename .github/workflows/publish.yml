# Publishes this n8n community node package to npm on every version tag push.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements.
#
# ─── HOW AUTHENTICATION WORKS HERE ─────────────────────────────────────────────
#
# This workflow uses OIDC Trusted Publishing — no npm token is stored anywhere.
# GitHub Actions proves its identity to npm, npm hands back a short-lived
# credential, and provenance is attached automatically.
#
# Why not an npm token: publishing with a classic/automation token requires a
# one-time password when the account enforces 2FA, and a workflow has no way to
# supply one. Both the 1.2.3 and 1.3.0 runs died exactly there:
#
#     npm error code EOTP
#     npm error This operation requires a one-time password.
#
# Both versions ended up published by hand from a laptop, which also means they
# carry NO provenance attestation. npm is additionally phasing out tokens that
# bypass 2FA, so a "stronger token" would only postpone the same failure.
#
# ─── ONE-TIME SETUP (required before this workflow can publish) ────────────────
#
#   1. Log in to npmjs.com → package `n8n-nodes-gapli` → Settings.
#   2. "Publish access" → "Trusted Publishers" → "Add a publisher".
#   3. Select GitHub Actions and fill in EXACTLY:
#        Repository owner:  Gapli-Full-Dropshipping
#        Repository name:   n8n-nodes-gapli
#        Workflow filename: publish.yml
#        Environment:       NPM_TOKEN     ← must match `environment:` below
#   4. Afterwards the NPM_TOKEN secret is dead weight and can be deleted.
#
# ⚠️ Until step 3 is done, publishing fails with a 404 on PUT — npm masks
#    "not authorised" as "not found" for packages you cannot write to.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    # Kept so the trusted-publisher entry can be scoped to this environment.
    # If you configure the publisher WITHOUT an environment, delete this line —
    # a mismatch here is rejected by npm as an untrusted request.
    environment: NPM_TOKEN

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing needs npm >= 11.5.1. Node LTS still ships npm 10.x,
      # which ignores OIDC entirely and falls back to looking for a token.
      - name: Upgrade npm for OIDC support
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # A re-run of an already-published tag would otherwise fail with a
      # conflict and look like a broken pipeline. Both 1.2.3 and 1.3.0 are
      # already on npm, so a re-run to validate the auth path is likely.
      - name: Check whether this version is already published
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "n8n-nodes-gapli@$VERSION" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::n8n-nodes-gapli@$VERSION is already on npm — skipping publish."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # No NODE_AUTH_TOKEN on purpose: npm exchanges the GitHub OIDC token for a
      # short-lived credential. Provenance is attached automatically, so the
      # explicit --provenance flag is no longer needed.
      - name: Publish to npm
        if: steps.check.outputs.already == 'false'
        run: npm publish --access public
